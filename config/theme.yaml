# config/theme.yaml
# DSS Dashboard — Theme Configuration
# web/styles/theme.py 가 이 파일을 로드합니다.
# 파일이 없으면 theme.py의 하드코딩 기본값을 사용합니다.

colors:
  buy:        "#22c55e"   # green-500
  sell:       "#ef4444"   # red-500
  hold:       "#f97316"   # orange-500
  info:       "#3b82f6"   # blue-500
  warn:       "#eab308"   # yellow-500
  bg:         "#ffffff"
  card:       "#f8fafc"
  border:     "#e2e8f0"
  text:       "#1e293b"
  muted:      "#64748b"
  success_bg: "#f0fdf4"
  danger_bg:  "#fef2f2"

action_colors:
  BUY:  "#22c55e"
  SELL: "#ef4444"
  HOLD: "#f97316"
  WAIT: "#f97316"

health_colors:
  HEALTHY:  "#22c55e"
  DEGRADED: "#f97316"
  CRITICAL: "#ef4444"
  UNKNOWN:  "#64748b"

grade_colors:
  "A+": "#22c55e"
  "A":  "#22c55e"
  "B":  "#3b82f6"
  "C":  "#f97316"
  "D":  "#ef4444"
  "F":  "#ef4444"
  "N/A": "#64748b"

typography:
  font_family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
  hero_size:   "36px"
  title_size:  "11px"
  sub_size:    "13px"
  badge_size:  "12px"

layout:
  card_padding:    "14px 16px"
  card_radius:     "12px"
  section_gap:     "10px"
  progress_height: "8px"
